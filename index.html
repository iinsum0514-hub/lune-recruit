<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lune - 募集フォーム</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f6f4f1;
  font-family: 'Noto Sans JP', sans-serif;
  color: #3f3b4a;
  padding: 40px 20px 80px;
}

.page {
  max-width: 760px;
  margin: 0 auto;
}

/* ---------- header ---------- */
.header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 8px;
}
.brand {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}
.brand .moon { font-size: 2.6rem; margin-bottom: 6px; }
.brand .name {
  font-family: 'Great Vibes', cursive;
  font-size: 4.6rem;
  color: #665ec2;
  line-height: 1;
}
.sub {
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  letter-spacing: 0.35em;
  color: #9992d1;
  font-size: 0.95rem;
  margin-left: 4.4rem;
  margin-top: -4px;
}
.headline {
  text-align: right;
  font-weight: 800;
  color: #665ec2;
  font-size: 1.5rem;
  line-height: 1.5;
}
.headline .big { font-size: 1.9rem; }

.intro {
  color: #6a6675;
  font-size: 1.08rem;
  line-height: 1.9;
  margin: 24px 0 36px;
}

/* ---------- card ---------- */
.card {
  position: relative;
  background: #ffffff;
  border-radius: 32px;
  padding: 56px 32px 40px;
  box-shadow: 0 10px 40px rgba(120, 108, 190, 0.14);
}
.card-tag {
  position: absolute;
  top: -24px;
  left: 32px;
  background: #665ec2;
  color: #fff;
  font-weight: 700;
  font-size: 1.2rem;
  padding: 14px 32px;
  border-radius: 50px;
  box-shadow: 0 8px 18px rgba(102, 94, 194, 0.35);
}

.field {
  display: flex;
  align-items: center;
  gap: 16px;
  background: #f5f3fb;
  border-radius: 18px;
  padding: 16px 22px;
  margin-bottom: 14px;
}
.field .icon { font-size: 1.5rem; width: 34px; text-align: center; flex-shrink: 0; }
.field label {
  font-weight: 700;
  font-size: 1.08rem;
  width: 130px;
  flex-shrink: 0;
  color: #4a4658;
}
.field select,
.field input[type="text"] {
  flex: 1;
  border: 2px solid #e2defb;
  background: #fff;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 1.05rem;
  font-family: inherit;
  color: #3f3b4a;
  appearance: none;
  -webkit-appearance: none;
  outline: none;
  transition: border-color .15s;
  cursor: pointer;
}
.field input[type="text"] { cursor: text; }
.field select:focus,
.field input[type="text"]:focus {
  border-color: #8f86e0;
}
.select-wrap {
  flex: 1;
  position: relative;
}
.select-wrap::after {
  content: "▾";
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #9992d1;
  pointer-events: none;
  font-size: 1rem;
}
.select-wrap select { width: 100%; padding-right: 38px; }

.note {
  text-align: center;
  color: #a49bd6;
  font-size: 1rem;
  line-height: 1.8;
  margin: 22px 0 8px;
}

/* ---------- preview ---------- */
.preview-wrap { margin-top: 40px; }
.preview-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  color: #665ec2;
  font-size: 1.15rem;
  margin-bottom: 14px;
}
.preview-box {
  background: #302c47;
  color: #f2f0fa;
  border-radius: 20px;
  padding: 26px 28px;
  font-size: 1.05rem;
  line-height: 2;
  white-space: pre-wrap;
  word-break: break-word;
  font-family: 'Noto Sans JP', sans-serif;
}
.preview-box .ph { color: #9089c9; }

.copy-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin-top: 16px;
  background: #665ec2;
  color: #fff;
  border: none;
  border-radius: 16px;
  padding: 18px;
  font-size: 1.1rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background .15s, transform .1s;
}
.copy-btn:hover { background: #5850ad; }
.copy-btn:active { transform: scale(0.98); }
.copy-btn.copied { background: #4caf7d; }

/* ---------- rooms / speech ---------- */
.bottom-grid {
  display: flex;
  gap: 18px;
  margin-top: 34px;
  flex-wrap: wrap;
}
.room-box, .speech-box {
  flex: 1;
  min-width: 240px;
  border-radius: 22px;
  padding: 24px;
  text-align: center;
}
.room-box {
  border: 2px dashed #d6cff5;
  background: #fbfaff;
}
.room-title { color: #9089c9; font-size: 0.95rem; margin-bottom: 14px; font-weight: 600; }
.room-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #f5f3fb;
  border-radius: 40px;
  padding: 10px 22px;
  font-weight: 700;
  font-size: 1.02rem;
  margin: 0 6px 8px;
}
.room-note { font-size: 0.85rem; color: #a89fd9; margin-top: 8px; }
.speech-box {
  border: 2px solid #ece8fb;
  background: #fff;
  font-size: 0.98rem;
  line-height: 1.8;
  color: #5a5666;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ---------- footer ---------- */
.footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 56px;
}
.footer-line {
  flex: 1;
  max-width: 120px;
  height: 2px;
  background: repeating-linear-gradient(90deg, #cfc7ef 0, #cfc7ef 8px, transparent 8px, transparent 16px);
}
.footer-lune { font-family: 'Great Vibes', cursive; font-size: 2.4rem; color: #8b83c9; }
.havefun { font-family: 'Great Vibes', cursive; font-size: 1.7rem; color: #8b83c9; }

@media (max-width: 560px) {
  .header-row { flex-direction: column; }
  .headline { text-align: left; }
  .field { flex-wrap: wrap; }
  .field label { width: 100%; }
  .field .icon { display: none; }
}
</style>
</head>
<body>
<div class="page">

  <div class="header-row">
    <div>
      <div class="brand"><span class="moon">🌙</span><span class="name">Lune</span></div>
      <div class="sub">VALORANT COMMUNITY</div>
    </div>
    <div class="headline">一緒に遊ぶ人を<br><span class="big">募集しよう！</span></div>
  </div>

  <div class="intro">
    「コンペ@1」「アンレ@2」みたいに、簡単な募集だけでもOK！<br>
    ドロップダウンで選ぶだけで、募集文が自動でできあがるよ🌙
  </div>

  <div class="card">
    <div class="card-tag">📋 かんたん募集フォーム</div>

    <div class="field">
      <div class="icon">🎮</div>
      <label for="mode">モード</label>
      <div class="select-wrap">
        <select id="mode">
          <option value="">選んでね</option>
          <option>コンペ</option>
          <option>アンレ</option>
          <option>スイフト</option>
          <option>カスタム</option>
          <option>デスマッチ</option>
          <option>スパイク・ラッシュ</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="icon">👥</div>
      <label for="count">募集人数</label>
      <div class="select-wrap">
        <select id="count">
          <option value="">選んでね</option>
          <option>@1</option>
          <option>@2</option>
          <option>@3</option>
          <option>@4</option>
          <option>人数相談</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="icon">🎙️</div>
      <label for="vc">VC</label>
      <div class="select-wrap">
        <select id="vc">
          <option value="">選んでね</option>
          <option>あり</option>
          <option>なし</option>
          <option>どちらでも</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="icon">🌙</div>
      <label for="room">部屋</label>
      <div class="select-wrap">
        <select id="room">
          <option value="">選んでね</option>
          <option>Valo1</option>
          <option>Valo2</option>
          <option>どちらでも</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="icon">🎀</div>
      <label for="target">募集</label>
      <div class="select-wrap">
        <select id="target">
          <option value="">選んでね</option>
          <option>誰でも</option>
          <option>女の子限定</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="icon">👑</div>
      <label for="rank">ランク</label>
      <div class="select-wrap">
        <select id="rank">
          <option value="">選んでね（コンペの場合）</option>
          <option>アイアン以上</option>
          <option>ブロンズ以上</option>
          <option>シルバー以上</option>
          <option>ゴールド以上</option>
          <option>プラチナ以上</option>
          <option>ダイヤ以上</option>
          <option>アセンダント以上</option>
          <option>イモータル以上</option>
          <option>レディアント</option>
          <option>指定なし</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="icon">💬</div>
      <label for="comment">ひとこと</label>
      <input type="text" id="comment" placeholder="自由に入力してね（例：楽しくやりましょ〜！）">
    </div>

    <div class="note">※選べるところだけでOK！全部埋めなくても大丈夫だよ 🐱♡</div>

    <div class="preview-wrap">
      <div class="preview-title">✦ プレビュー（そのままDiscordにコピペOK）</div>
      <div class="preview-box" id="preview"></div>
      <button class="copy-btn" id="copyBtn">📋 コピーする</button>
    </div>

    <div class="bottom-grid">
      <div class="room-box">
        <div class="room-title">✦ 部屋の名前 ✦</div>
        <span class="room-pill">🌙 Valo1</span>
        <span class="room-pill">🌙 Valo2</span>
        <div class="room-note">※2つのゲームの部屋があるよ🌙</div>
      </div>
      <div class="speech-box">
        「コンペ@1」の一言だけでも大歓迎！<br>気軽に募集して、一緒に遊ぼう🌙
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-line"></div>
    <span class="footer-lune">Lune</span>
    <div class="footer-line"></div>
  </div>
  <div style="text-align:center; margin-top:10px;">
    <span class="havefun">Have fun ♡</span>
  </div>

</div>

<script>
const ids = ['mode','count','vc','room','target','rank','comment'];
const els = {};
ids.forEach(id => {
  els[id] = document.getElementById(id);
  els[id].addEventListener('input', updatePreview);
});

function line(icon, label, value) {
  const v = value && value.trim() ? value.trim() : '（未入力）';
  return `${icon} ${label}\t：${v}`;
}

function updatePreview() {
  const mode = els.mode.value;
  const count = els.count.value;
  const vc = els.vc.value;
  const room = els.room.value;
  const target = els.target.value;
  const rank = els.rank.value;
  const comment = els.comment.value;

  const lines = [];
  lines.push('🌙 **Lune 募集**');
  lines.push('');
  if (mode || count) lines.push(`🎮 モード：${mode || '未定'}${count ? '　@' + count.replace('@','') : ''}`);
  if (vc) lines.push(`🎙️ VC：${vc}`);
  if (room) lines.push(`🌙 部屋：${room}`);
  if (target) lines.push(`🎀 募集：${target}`);
  if (rank) lines.push(`👑 ランク：${rank}`);
  if (comment) lines.push(`💬 ひとこと：${comment}`);

  if (lines.length === 2) {
    lines.push('（項目を選ぶとここにプレビューが表示されます）');
  }

  document.getElementById('preview').textContent = lines.join('\n');
}

document.getElementById('copyBtn').addEventListener('click', () => {
  const text = document.getElementById('preview').textContent;
  const btn = document.getElementById('copyBtn');
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ コピーしました！';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 コピーする';
      btn.classList.remove('copied');
    }, 1800);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅ コピーしました！';
    setTimeout(() => { btn.textContent = '📋 コピーする'; }, 1800);
  });
});

updatePreview();
</script>
</body>
</html>
